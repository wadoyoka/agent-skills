<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="縦軸と横軸で4象限に分けた2×2マトリクスの図">
  <!-- 2×2マトリクス：2つの軸で4象限に整理する。分類・優先度・戦略の型 -->
  <rect x="0" y="0" width="800" height="300" rx="14" fill="#FBF7EC"/>

  <!-- 2本の軸（象限の境目） -->
  <path d="M488 28 L488 268" fill="none" stroke="#2B2A26" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M220 148 L756 148" fill="none" stroke="#2B2A26" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 左上（うれしい＝緑） -->
  <rect x="230" y="40" width="255" height="105" rx="10" fill="#DEEFD8" stroke="#2B2A26" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="357" y="88" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="15" fill="#2B2A26">左上の象限 ✓</text>
  <text x="357" y="113" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="12.5" fill="#4E9A51">当てはまる例</text>

  <!-- 右上（中立＝青） -->
  <rect x="491" y="40" width="255" height="105" rx="10" fill="#DDEAF4" stroke="#2B2A26" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="618" y="88" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="15" fill="#2B2A26">右上の象限</text>
  <text x="618" y="113" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="12.5" fill="#2B2A26">当てはまる例</text>

  <!-- 左下（中立＝cream） -->
  <rect x="230" y="151" width="255" height="105" rx="10" fill="#FFFDF7" stroke="#2B2A26" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="357" y="199" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="15" fill="#2B2A26">左下の象限</text>
  <text x="357" y="224" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="12.5" fill="#2B2A26">当てはまる例</text>

  <!-- 右下（避けたい＝ink破線＋赤ラベル） -->
  <rect x="491" y="151" width="255" height="105" rx="10" fill="#FFFDF7" stroke="#2B2A26" stroke-width="2.5" stroke-dasharray="9 7" stroke-linejoin="round"/>
  <text x="618" y="199" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="15" fill="#2B2A26">右下の象限 ×</text>
  <text x="618" y="224" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="12.5" fill="#C64444">当てはまる例</text>

  <!-- 軸ラベル -->
  <text x="118" y="54" font-family="Zen Kurenaido, sans-serif" font-size="13.5" fill="#2B2A26">縦軸 高い ↑</text>
  <text x="118" y="252" font-family="Zen Kurenaido, sans-serif" font-size="13.5" fill="#2B2A26">縦軸 低い ↓</text>
  <text x="240" y="288" font-family="Zen Kurenaido, sans-serif" font-size="13.5" fill="#2B2A26">← 横軸 小</text>
  <text x="746" y="288" text-anchor="end" font-family="Zen Kurenaido, sans-serif" font-size="13.5" fill="#2B2A26">横軸 大 →</text>
</svg>

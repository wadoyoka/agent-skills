<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-label="1つの入口から2つの道に分かれ、それぞれ違う結末に至る図">
  <!-- 分岐：1つの起点 → 2つの選択肢。上＝注意/危険（赤・破線）、下＝安全/推奨（緑）の型 -->
  <rect x="0" y="0" width="800" height="250" rx="14" fill="#FBF7EC"/>
  <text x="400" y="32" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="16" fill="#2B2A26">1つの入口 → 2つの道</text>

  <!-- 分岐の起点（主役） -->
  <rect x="35" y="104" width="150" height="54" rx="10" fill="#D9CFB6"/>
  <rect x="30" y="98" width="150" height="54" rx="10" fill="#FFFDF7" stroke="#2B2A26" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="105" y="132" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="15" fill="#2B2A26">起点</text>

  <!-- 道A（上・注意/危険） -->
  <path d="M188 114 Q250 114 292 74" fill="none" stroke="#C64444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M288 88 L292 74 L278 78" fill="none" stroke="#C64444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="300" y="46" width="190" height="52" rx="10" fill="#FFFDF7" stroke="#2B2A26" stroke-width="2.5" stroke-dasharray="9 7" stroke-linejoin="round"/>
  <text x="395" y="71" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="14" fill="#2B2A26">道A</text>
  <text x="395" y="90" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="12.5" fill="#C64444">こう進むと…</text>
  <path d="M492 72 L552 72" fill="none" stroke="#C64444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M544 65 L556 72 L544 79" fill="none" stroke="#C64444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="564" y="46" width="206" height="52" rx="10" fill="#FFFDF7" stroke="#2B2A26" stroke-width="2.5" stroke-dasharray="9 7" stroke-linejoin="round"/>
  <text x="667" y="79" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="13.5" fill="#C64444">注意が要る結末 ×</text>

  <!-- 道B（下・安全/推奨） -->
  <path d="M188 136 Q250 136 292 176" fill="none" stroke="#4E9A51" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M288 162 L292 176 L278 172" fill="none" stroke="#4E9A51" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="300" y="152" width="190" height="52" rx="10" fill="#DEEFD8" stroke="#2B2A26" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="395" y="177" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="14" fill="#2B2A26">道B</text>
  <text x="395" y="196" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="12.5" fill="#4E9A51">こう進むと…</text>
  <path d="M492 178 L552 178" fill="none" stroke="#4E9A51" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M544 171 L556 178 L544 185" fill="none" stroke="#4E9A51" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="564" y="152" width="206" height="52" rx="10" fill="#DEEFD8" stroke="#2B2A26" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="667" y="185" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="13.5" fill="#4E9A51">安全な結末 ✓</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" id="veTime" viewBox="0 0 800 170" role="img" aria-label="左から右へ4つの節目が並ぶ時系列の図">
  <style>
    @keyframes veTimeDash{to{stroke-dashoffset:-180}}
    #veTime .flow{animation:veTimeDash 4.5s linear infinite}
    @media (prefers-reduced-motion:reduce){#veTime .flow{animation:none}}
  </style>
  <!-- 時系列/手順：左から右へ時間が流れる。歴史・工程・順番の型 -->
  <rect x="0" y="0" width="800" height="170" rx="14" fill="#FBF7EC"/>

  <!-- 基準線（ink）＋ 流れる朱の破線 -->
  <path d="M70 90 L730 90" fill="none" stroke="#2B2A26" stroke-width="3.5" stroke-linecap="round"/>
  <path class="flow" d="M70 90 L730 90" fill="none" stroke="#EA5A3D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 10"/>
  <path d="M727 81 L741 90 L727 99" fill="none" stroke="#2B2A26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 節目1 -->
  <circle cx="140" cy="90" r="10" fill="#DDEAF4" stroke="#2B2A26" stroke-width="2.5"/>
  <text x="140" y="58" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="14" fill="#2B2A26">節目 1</text>
  <text x="140" y="125" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="12.5" fill="#2B2A26">何が起きる</text>

  <!-- 節目2（主役） -->
  <circle cx="330" cy="90" r="12" fill="#EA5A3D" stroke="#2B2A26" stroke-width="2.5"/>
  <text x="330" y="58" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="14" fill="#2B2A26">節目 2</text>
  <text x="330" y="125" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="12.5" fill="#EA5A3D">何が起きる</text>

  <!-- 節目3 -->
  <circle cx="520" cy="90" r="10" fill="#DDEAF4" stroke="#2B2A26" stroke-width="2.5"/>
  <text x="520" y="58" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="14" fill="#2B2A26">節目 3</text>
  <text x="520" y="125" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="12.5" fill="#2B2A26">何が起きる</text>

  <!-- 節目4（ゴール） -->
  <circle cx="700" cy="90" r="10" fill="#DEEFD8" stroke="#2B2A26" stroke-width="2.5"/>
  <text x="700" y="58" text-anchor="middle" font-family="Yusei Magic, sans-serif" font-size="14" fill="#2B2A26">節目 4</text>
  <text x="700" y="125" text-anchor="middle" font-family="Zen Kurenaido, sans-serif" font-size="12.5" fill="#4E9A51">到達点 ✓</text>
</svg>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>解説動画</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      シーンは <section class="scene" data-scene="ID"> を narration.json の順に並べる。
      ふつうのシーンは .head（章名と見出し）と .body（本文）を持つ。
      動きは data-at / data-active / data-grow / data-count で指定する（runtime.js の先頭に説明）。
      アイコンは <svg class="icon"><use href="#i-名前" /></svg>。
      下の 4 つは assets/narration.example.json 用の見本。実際の動画では書き換える。
    -->
    <svg width="0" height="0" style="position: absolute">
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="M6 6l12 12" /></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="M7 10l5 5 5-5" /><path d="M12 15V3" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /><path d="M16 13H8" /><path d="M16 17H8" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><path d="M12 9v4" /><path d="M12 17h.01" /></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8" /><path d="M12 17v4" /></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 1v4M12 19v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M1 12h4M19 12h4M4.2 19.8 7 17M17 7l2.8-2.8" /></symbol>
      <symbol id="i-git" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="9" r="3" /><path d="M6 9v6" /><path d="M18 12c0 4-6 3-9 6" /></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3" /><path d="M19 10v1a7 7 0 0 1-14 0v-1" /><path d="M12 18v4" /></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" /><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5" /></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></symbol>
    </svg>

    <div id="stage">
      <section class="scene" data-scene="title">
        <div class="center">
          <div class="row" data-at="0">
            <div class="badge"><svg class="icon"><use href="#i-film" /></svg></div>
            <span style="font-size: 40px; font-weight: 700">見本</span>
          </div>
          <div style="font-size: 96px; font-weight: 800; margin-top: 30px" data-at="0+14">解説動画テンプレート</div>
          <div class="row" style="gap: 20px; margin-top: 40px" data-at="0+20">
            <span class="pill" style="font-size: 30px">1　作り方</span>
            <span class="pill" style="font-size: 30px; color: #fff; background: #1e2230">2　しくみ</span>
          </div>
        </div>
      </section>

      <section class="scene" data-scene="points">
        <div class="head"><div class="part" data-part></div><div class="title">作り方は 3 ステップ</div></div>
        <div class="body">
          <div class="row" style="gap: 30px; margin-top: 40px; align-items: stretch">
            <div class="card" style="flex: 1; height: 256px" data-at="1" data-anim="scale" data-active="1~2">
              <div class="badge"><svg class="icon"><use href="#i-pen" /></svg></div>
              <div style="font-size: 40px; font-weight: 800; margin-top: 24px">1 原稿を書く</div>
              <div style="font-size: 26px; color: var(--sub); margin-top: 12px">字幕の表記と、読み上げ用の読み</div>
            </div>
            <div class="card" style="flex: 1; height: 256px" data-at="1+10" data-anim="scale" data-active="1+10~2">
              <div class="badge"><svg class="icon"><use href="#i-mic" /></svg></div>
              <div style="font-size: 40px; font-weight: 800; margin-top: 24px">2 音声を作る</div>
              <div style="font-size: 26px; color: var(--sub); margin-top: 12px">VOICEVOX で 1 文ずつ</div>
            </div>
            <div class="card" style="flex: 1; height: 256px" data-at="1+20" data-anim="scale" data-active="1+20~2">
              <div class="badge"><svg class="icon"><use href="#i-film" /></svg></div>
              <div style="font-size: 40px; font-weight: 800; margin-top: 24px">3 シーンを書く</div>
              <div style="font-size: 26px; color: var(--sub); margin-top: 12px">文に合わせて要素を出す</div>
            </div>
          </div>
          <div class="row" style="margin-top: 40px; font-size: 32px; font-weight: 700; color: var(--accent2)" data-at="2">
            <svg class="icon"><use href="#i-check" /></svg>
            画面はナレーションの文に合わせて動く
          </div>
        </div>
      </section>

      <section class="scene" data-scene="flow">
        <div class="head"><div class="part" data-part></div><div class="title">音声と画面の合わせ方</div></div>
        <div class="body">
          <div class="row" style="gap: 16px; margin-top: 80px">
            <div class="card row" style="width: 460px; gap: 20px" data-at="0" data-anim="scale" data-active="0~0+60">
              <div class="badge"><svg class="icon"><use href="#i-mic" /></svg></div>
              <div><div style="font-size: 32px; font-weight: 800">1 文ずつの音声</div><span class="code">public/audio/*.wav</span></div>
            </div>
            <div class="arrow" data-grow="1"></div>
            <div class="card row" style="width: 460px; gap: 20px" data-at="1" data-anim="scale" data-active="1~1+60">
              <div class="badge"><svg class="icon"><use href="#i-file" /></svg></div>
              <div><div style="font-size: 32px; font-weight: 800">開始フレーム</div><span class="code">timing.json</span></div>
            </div>
            <div class="arrow" data-grow="2"></div>
            <div class="card row" style="width: 460px; gap: 20px" data-at="2" data-anim="scale" data-active="2~2+60">
              <div class="badge"><svg class="icon"><use href="#i-film" /></svg></div>
              <div><div style="font-size: 32px; font-weight: 800">シーン</div><span class="code">data-at="n"</span></div>
            </div>
          </div>
        </div>
      </section>

      <section class="scene" data-scene="end">
        <div class="center">
          <div style="font-size: 72px; font-weight: 800; color: var(--accent)" data-at="0" data-anim="scale">おわり</div>
        </div>
      </section>

      <div id="subtitle"></div>
      <div id="progress"><div class="fill"></div></div>
      <div id="credit"></div>
    </div>

    <script src="runtime.js"></script>
  </body>
</html>
